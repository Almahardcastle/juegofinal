<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Revelar mensaje</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pantalla 1: inicio -->
  <section id="pantalla-inicio" class="pantalla activa">
    <div class="contenido">
      <p class="texto-grande">¡Arrastrá el lápiz para revelar el mensaje final!</p>
      <button id="btn-jugar" class="boton">Jugar</button>
    </div>
  </section>

  <!-- Pantalla 2: interacción -->
  <section id="pantalla-juego" class="pantalla">
    <img id="fondo" src="fondo.png" alt="" draggable="false">
    <canvas id="lienzo"></canvas>
    <img id="lapiz" src="lapiz.png" alt="" draggable="false">
  </section>

  <!-- Pantalla 3: final -->
  <section id="pantalla-final" class="pantalla">
    <div class="contenido">
      <p class="texto-grande">¡Muy bien! aprendiste a no olvidar como Agus</p>
      <button id="btn-repetir" class="boton">Jugar de nuevo</button>
    </div>
  </section>

  <!-- Aviso solo vertical -->
  <div id="aviso-vertical">
    <p>Gira tu celular a posición vertical</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
